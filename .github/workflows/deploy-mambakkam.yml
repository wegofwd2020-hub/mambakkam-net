name: Deploy mambakkam.net

# Auto-deploy mambakkam.net to the Hetzner VPS on every push to main, plus
# manual trigger for forced redeploys.
#
# Sequence (~3 min):
#   1. SSH to VPS as `deploy` user using MAMBAKKAM_VPS_SSH_KEY secret
#   2. Run /opt/mambakkam/scripts/launch/deploy.sh (git pull, compose build,
#      compose up -d, local smoke)
#   3. Run scripts/launch/smoke.sh against the public domain from the runner
#   4. On smoke failure: open a GitHub issue tagged `incident:mambakkam`;
#      auto-rollback is intentionally NOT wired — operator must triage.
#
# Required repo secrets:
#   MAMBAKKAM_VPS_HOST  — hostname or IP (often same VPS as StudyBuddy)
#   MAMBAKKAM_VPS_USER  — typically `deploy`
#   MAMBAKKAM_VPS_SSH_KEY  — private SSH key for the deploy user
#
# Required repo variable (Settings → Variables → Actions):
#   MAMBAKKAM_DEPLOY_ENABLED  — set to "true" only after the Day 0
#                                cold-start when the VPS exists and the
#                                three secrets above are populated.
#                                Unset (default) → this workflow's job
#                                skips with "skipped" status, keeping
#                                the CI badge green during pre-launch.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A second push while a deploy is in flight would race against itself on the
# VPS (two `docker compose up --build` running concurrently). Cancel the older
# run; the newer SHA will deploy.
concurrency:
  group: deploy-mambakkam
  cancel-in-progress: true

jobs:
  deploy:
    # Gated until Day 0 (Sun 2026-05-17): the VPS doesn't exist yet and the
    # repo secrets aren't populated. Setting MAMBAKKAM_DEPLOY_ENABLED=true in
    # repo Variables on Day 0 morning enables auto-deploy.
    if: vars.MAMBAKKAM_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # for the failure-issue step

    env:
      PUBLIC_URL: https://mambakkam.net

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MAMBAKKAM_VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.MAMBAKKAM_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deploy.sh on VPS
        run: |
          ssh -i ~/.ssh/id_deploy \
            "${{ secrets.MAMBAKKAM_VPS_USER }}@${{ secrets.MAMBAKKAM_VPS_HOST }}" \
            'bash /opt/mambakkam/scripts/launch/deploy.sh'

      - name: Public-side smoke
        id: smoke
        run: |
          # deploy.sh returns as soon as the container is told to rebuild; nginx
          # can still be serving the previous build for a while afterwards.
          # Measured on this site: ~20s for a content change, ~3 minutes when the
          # commit adds a new route, because the path does not exist until the
          # new build is live. Asserting on the first attempt turned that timing
          # into a red deploy and a permanent incident issue twice (#107, #115),
          # both describing a site that was healthy minutes later.
          #
          # So: retry to a deadline. A real outage still fails, four minutes
          # later, and the incident it files then means something.
          deadline=$(( SECONDS + 240 ))
          attempt=1
          while true; do
            if bash scripts/launch/smoke.sh "$PUBLIC_URL"; then
              echo "::notice::smoke passed on attempt ${attempt}"
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::smoke still failing after ${attempt} attempts across 4 minutes"
              exit 1
            fi
            echo "::notice::attempt ${attempt} failed — deploy may still be propagating; retrying in 20s"
            attempt=$(( attempt + 1 ))
            sleep 20
          done

      - name: File incident issue on smoke failure
        if: failure() && steps.smoke.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[incident] mambakkam.net deploy smoke failed @ ${context.sha.substring(0,7)}`;

            // A re-run of a failed job would otherwise file a second issue for
            // the same commit. Comment on the existing one instead, so the
            // incident list stays one-per-incident rather than one-per-attempt.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident:mambakkam',
            });
            const dupe = existing.data.find((i) => i.title === title);
            if (dupe) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dupe.number,
                body: `Smoke failed again for this commit — ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['incident:mambakkam', 'priority:high'],
              body: [
                `Smoke check failed after auto-deploy, and kept failing for four`,
                `minutes of retries. This is not the deploy still propagating —`,
                `that is already accounted for. Treat it as a real failure.`,
                ``,
                `**Workflow run:** ${runUrl}`,
                `**Commit:** ${context.sha}`,
                ``,
                `**Triage checklist:**`,
                `- [ ] Open the workflow run; read the smoke output to see which check failed`,
                `- [ ] SSH to the VPS: \`ssh deploy@${{ secrets.MAMBAKKAM_VPS_HOST }}\``,
                `- [ ] Inspect: \`docker compose -f docker-compose.demo.yml --env-file .env.demo logs --tail 200\``,
                `- [ ] If the build succeeded but content is wrong: \`cd /opt/mambakkam && git log --oneline -5\``,
                `- [ ] If a rollback is needed: \`sudo git -C /opt/mambakkam reset --hard <previous-sha> && bash scripts/launch/deploy.sh\``,
                `- [ ] Re-run the smoke locally on the VPS: \`bash scripts/launch/smoke.sh http://127.0.0.1:8081\``,
                ``,
                `Auto-rollback is intentionally not wired — an operator must decide.`,
              ].join('\n'),
            });
