<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StudyBuddy OnDemand og:image</title>
    <!-- render.mjs reads this to know where the PNG lands. -->
    <meta name="og-out" content="src/assets/images/work/studybuddy-ondemand-og.png" />
    <link rel="stylesheet" href="../card.css" />
    <style>
      /* Ink-teal, cooler than the site card's warm pine, because the mark is a
         pale sage watercolour banyan and a warm ground turns it muddy. Sage is
         the accent, pulled from the logo's own canopy rather than picked to
         match it by eye. */
      .card {
        --ground:
          radial-gradient(ellipse 70% 55% at 76% 6%, rgb(168 189 134 / 16%) 0%, transparent 62%),
          radial-gradient(ellipse 54% 44% at 8% 96%, rgb(90 150 150 / 12%) 0%, transparent 58%),
          linear-gradient(174deg, #10262a 0%, #0a181b 60%, #050e10 100%);
        --frame-line: rgb(195 211 166 / 22%);
        --frame-dot: rgb(195 211 166 / 55%);
        --rule-line: rgb(195 211 166 / 48%);
        --rule-dot: rgb(195 211 166 / 74%);
        --mark-glow: rgb(195 211 166 / 26%);
        --mark-blur: 24px;
        --wordmark: #eef2e6;
        --accent: #a8bd86;
        --statement: linear-gradient(168deg, #f2f5ea 6%, #c3d3a6 52%, #8fae74 96%);
        --sub: #a2b0ae;
      }

      /* The banyan is a wide watercolour illustration, not a square glyph — the
         96x96 box would letterbox it to a smudge. Sized by height, like the
         Agastya sage, so the canopy is still readable at thumbnail size. */
      .brand img {
        width: auto;
        height: 150px;
      }
      .brand {
        gap: 20px;
      }

      .wordmark {
        font-size: 62px;
      }
      .tagline {
        margin-top: 12px;
        font-size: 22px;
        letter-spacing: 0.16em;
      }
      .rule {
        margin: 24px 0 28px;
      }
      .statement {
        font-size: 44px;
      }
      .sub {
        margin-top: 22px;
        font-size: 23px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="frame"><span></span><span></span><span></span><span></span></div>
      <div class="inner">
        <div class="brand">
          <img src="../../../src/assets/images/work/studybuddy-ondemand-logo.png" alt="" />
          <div class="wordmark">StudyBuddy</div>
        </div>
        <!-- Grades 5-12, not K-12, and nothing here says "tutor": there is no
             tutoring, matching or scheduling in this product. Copy is taken from
             src/data/work/studybuddy-ondemand.md, which is the source of truth. -->
        <div class="tagline">ONDEMAND · STEM, GRADES 5–12</div>
        <div class="rule"><i></i><b></b><s></s><b></b><i></i></div>
        <div class="statement">Built once.<br /><em>Served instantly.</em></div>
        <div class="sub">Lessons, quizzes and audio generated ahead of time — and offline once downloaded</div>
      </div>
    </div>
  </body>
</html>
