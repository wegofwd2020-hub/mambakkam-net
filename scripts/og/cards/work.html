<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>/work og:image</title>
    <!-- render.mjs reads this to know where the PNG lands. -->
    <meta name="og-out" content="src/assets/images/work-og.png" />
    <link rel="stylesheet" href="../card.css" />
    <style>
      /* Azure & Gold — the exact tokens src/themes/azure.ts gives the page this
         card previews, so the link preview and the thing it opens read as one
         surface. Gold here is drawn line work rather than the receding seam it
         is in Emerald, which is why the frame and rule sit brighter than on the
         site card. */
      .card {
        --ground:
          radial-gradient(ellipse 66% 52% at 78% 6%, rgb(212 175 79 / 15%) 0%, transparent 60%),
          radial-gradient(ellipse 56% 46% at 8% 96%, rgb(46 108 178 / 16%) 0%, transparent 58%),
          linear-gradient(176deg, #0d2a45 0%, #071b2e 58%, #04101c 100%);
        --frame-line: rgb(212 175 79 / 26%);
        --frame-dot: rgb(212 175 79 / 60%);
        --rule-line: rgb(212 175 79 / 52%);
        --rule-dot: rgb(212 175 79 / 78%);
        --mark-glow: rgb(212 175 79 / 34%);
        --mark-blur: 22px;
        --wordmark: #eef3f8;
        --accent: #d4af4f;
        /* The page's own --th-gradient, turned off vertical so the two lines of
           the statement do not each restart the ramp. */
        --statement: linear-gradient(168deg, #eef3f8 6%, #f2dc9b 52%, #d4af4f 96%);
        --sub: #9fb3c6;
      }

      /* Same banyan as the site card. This is a section of mambakkam.net, not a
         separate brand — the palette is what distinguishes it, not the mark. */
      .brand svg {
        width: 84px;
        height: 84px;
      }

      .wordmark {
        font-size: 68px;
      }
      .tagline {
        margin-top: 14px;
        font-size: 25px;
        letter-spacing: 0.18em;
      }
      .rule {
        margin: 28px 0 32px;
      }
      .sub {
        margin-top: 24px;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="frame"><span></span><span></span><span></span><span></span></div>
      <div class="inner">
        <div class="brand">
          <svg viewBox="0 0 64 64" fill="#d4af4f" role="img" aria-label="">
            <g>
              <circle cx="32" cy="15" r="12" />
              <circle cx="20" cy="19" r="9.5" />
              <circle cx="44" cy="19" r="9.5" />
              <circle cx="12" cy="23" r="6.5" />
              <circle cx="52" cy="23" r="6.5" />
              <rect x="10" y="19" width="44" height="8" />
            </g>
            <path d="M28.6 25c-.4 10-1.4 18-3.6 26h14c-2.2-8-3.2-16-3.6-26z" />
            <g opacity="0.85">
              <rect x="17.4" y="25" width="1.6" height="26" />
              <rect x="45" y="25" width="1.6" height="26" />
              <rect x="11.4" y="26" width="1.3" height="25" rx="0.6" opacity="0.75" />
              <rect x="51.3" y="26" width="1.3" height="25" rx="0.6" opacity="0.75" />
            </g>
            <rect x="8" y="51" width="48" height="1.4" rx="0.7" opacity="0.55" />
          </svg>
          <div class="wordmark">Work</div>
        </div>
        <div class="tagline">SOFTWARE &amp; PROJECTS</div>
        <div class="rule"><i></i><b></b><s></s><b></b><i></i></div>
        <!-- Seven is the count of listed, non-draft entries in src/data/work/.
             If that changes, this line is wrong — it is the one number on the
             card that can rot. -->
        <div class="statement">Seven products.<br /><em>One village.</em></div>
        <div class="sub">Software products and projects from people of Mambakkam</div>
      </div>
    </div>
  </body>
</html>
